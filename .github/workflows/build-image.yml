name: Build and Publish AIPerf Image

on:
  workflow_dispatch:
    inputs:
      enable_ffmpeg:
        description: Build the full image with ffmpeg support
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      prefix:
        description: Optional tag prefix; defaults to the branch name (develop becomes dev)
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ vars.AIPERF_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      HARBOR_REGISTRY: harbor.weizhipin.com
      AIPERF_IMAGE: harbor.weizhipin.com/arsenal-ai/aiperf
      PUSH_IMAGE: "1"
      PUSH_CACHE: "1"
      ENABLE_FFMPEG: ${{ inputs.enable_ffmpeg || '1' }}
      IMAGE_TAG_PREFIX: ${{ inputs.prefix || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.weizhipin.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: aiperf-builder
          keep-state: ${{ runner.environment == 'self-hosted' }}
          driver-opts: |
            network=host
            image=harbor.weizhipin.com/arsenal-ai/moby/buildkit:buildx-stable-1

      - name: Build and publish image
        run: ./ci/scripts/build-image.sh
